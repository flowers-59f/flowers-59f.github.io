 baseURL: "https://flowers-59f.github.io/" # 主站的 URL
 title: 花落为谁念's Blog # 站点标题
 copyright: " email:2465604425@qq.com
              <br>
              [©2025 花落为谁念's Blog]" # 网站的版权声明，通常显示在页脚
 theme: PaperMod # 主题
 languageCode: zh-cn # 语言
 
 enableInlineShortcodes: true # shortcode，类似于模板变量，可以在写 markdown 的时候便捷地插入，官方文档中有一个视频讲的很通俗
 hasCJKLanguage: true # 是否有 CJK 的字符
 enableRobotsTXT: true # 允许生成 robots.txt
 buildDrafts: false # 构建时是否包括草稿
 buildFuture: false # 构建未来发布的内容
 buildExpired: false # 构建过期的内容
 enableEmoji: true # 允许 emoji
 pygmentsUseClasses: true
 defaultContentLanguage: zh # 顶部首先展示的语言界面
 defaultContentLanguageInSubdir: false # 是否要在地址栏加上默认的语言代码

 markup:
  goldmark:
    renderer:
      unsafe: true
  hightlight:


 languages:
  zh:
    languageName: "中文" # 展示的语言名
    weight: 1 # 权重
    taxonomies: # 分类系统
      category: categories
      tag: tags
    # https://gohugo.io/content-management/menus/#define-in-site-configuration
    menus:
      main:
        - name: 首页
          pageRef: /
          weight: 4 # 控制在页面上展示的前后顺序
        - name: 归档
          pageRef: archives/
          weight: 5
        - name: 分类
          pageRef: categories/
          weight: 10
        - name: 标签
          pageRef: tags/
          weight: 10
        - name: 搜索
          pageRef: search/
          weight: 20
        - name: 友链
          pageRef: friends/
          weight: 21
        - name: 关于
          pageRef: about/
          weight: 22
        - name: 记录
          pageRef: timeline/
          weight: 23
# https://github.com/adityatelange/hugo-PaperMod/wiki/Features#search-page
 outputs:
  home:
   - HTML # 生成的静态页面
   - RSS # 这个其实无所谓
   - JSON # necessary for search, 这里的配置修改好之后，一定要重新生成一下

 params:
   # 搜索
   fuseOpts:
       isCaseSensitive: false # 是否大小写敏感
       shouldSort: true # 是否排序
       location: 0
       distance: 1000
       threshold: 0.4
       minMatchCharLength: 0
       # limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
       keys: ["title", "permalink", "summary", "content"]
       includeMatches: true

   # 首页信息配置
   homeInfoParams:
       Title: "Hi there 👋"
       Content: |
        人生万事须自为，跬步江山即寥廓。<br>
        欢迎来到我的博客，这里是见证我成长的地方。我会分享我在学习和工作中的经验，也会记录我遇到的问题和对应的解决方法，希望能够帮助到你。<br>
        找不到想要内容时可以使用搜索功能哦~祝你生活愉快，越来越靠近理想中的生活。

   assets:
      favicon: "flower.png"
      favicon16x16: "flower.png"
      favicon32x32: "flower.png"
      apple_touch_icon: "flower.png"
      safari_pinned_tab: "flower.png"
 caches:
  images:
    dir: :cacheDir/images

 colors:
    entry: "#ffffff"

