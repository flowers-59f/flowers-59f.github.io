{{- define "main" }}
<style>
  /* 与列表页（首页/归档等）保持一致的底色，深浅色自动切换 */
  body {
    background-color: var(--code-bg);
  }

  [data-theme="dark"] body {
    background-color: var(--theme);
  }
</style>
<header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- if .Description }}
        <div class="post-description">
        {{ .Description }}
        </div>
        {{- end }}
</header>
 
<section>
  <br>
  {{ .Content }}
</section>
 
{{- end }}{{/* end main */}}
